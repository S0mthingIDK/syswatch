[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syswatch-linux"
version = "1.0.0"
description = "Local Linux system diagnostics and monitoring tool with an interactive TUI and scriptable CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "syswatch contributors" }]
keywords = [
    "linux", "monitoring", "diagnostics", "proc", "sysfs",
    "tui", "cli", "system", "health",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/S0mthingIDK/syswatch"
Repository = "https://github.com/S0mthingIDK/syswatch"
Issues = "https://github.com/S0mthingIDK/syswatch/issues"

[project.optional-dependencies]
tui = ["textual>=0.86", "rich>=13,<15"]
dev = ["pytest>=7", "textual>=0.86", "rich>=13,<15"]

[project.scripts]
syswatch = "syswatch.cli:main"

[tool.setuptools.packages.find]
include = ["syswatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
